<div class="section-header"><h2>Wagtopia Shop</h2></div>
{% if shop_items %}
{% for item in shop_items %}
<div class="module-card">
  <strong>{{ item.name }}</strong><br>
  <span class="muted">{{ item.category }} · {{ item.product_id }}</span><br>
  <span class="trend-up">{{ item.price_display }}</span>
</div>
{% endfor %}
{% else %}
<p class="section-footnote">No products available.</p>
{% endif %}
