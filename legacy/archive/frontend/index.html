<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wagtopia — Personalized Wellness Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=omega97e">
  <link rel="stylesheet" href="styles.css?v=omega97e">
</head>
<body>

<div class="device-frame">
  <div class="device-notch"></div>
  <div class="phone-app ppie-shell ppie-module">

    <header class="module-header" id="shell-topbar">
      <div class="module-header__row">
        <button type="button" class="module-back" id="module-back">← Back to Wagtopia</button>
        <div class="module-header__actions">
          <button type="button" class="module-ghost" id="module-load-demo">Load Demo Dog</button>
          <button type="button" class="module-ghost" id="module-analyze">Analyze</button>
          <button type="button" class="module-ghost" id="module-profile">Dog Profile</button>
          <button type="button" class="shell-search" id="shell-search-btn" aria-label="Search">Search</button>
          <button type="button" class="module-ghost" id="module-share">Share</button>
          <button type="button" class="module-ghost" id="module-pdf" disabled title="Coming soon">PDF</button>
        </div>
      </div>
      <div class="module-header__title">
        <p class="module-eyebrow">Wagtopia · Clinical intelligence</p>
        <p class="demo-catalog-banner" id="demo-catalog-banner" hidden>DEMO CATALOG — demonstration data, not scientific evidence</p>
        <h1 class="module-title">Personalized Wellness Analysis</h1>
        <p class="module-meta"><span id="module-generated">Generated today</span><span class="module-dot">·</span><span>Last updated with live clinical evidence</span></p>
      </div>
      <nav class="shell-crumbs" id="shell-crumbs" hidden></nav>
    </header>

    <main class="shell-main" id="shell-main">
      <section class="shell-page is-active" id="page-module" data-page="module" aria-label="Wellness analysis"></section>
    </main>

    <div id="ppie-sheet-host" class="ppie-sheet-host" aria-live="polite"></div>

    <div class="shell-search-panel" id="shell-search-panel" hidden>
      <div class="shell-search-panel__head">
        <input type="search" id="shell-search-input" placeholder="Search conditions, nutrients, products…" autocomplete="off">
        <button type="button" id="shell-search-close">Close</button>
      </div>
      <div id="shell-search-results" class="shell-search-results"></div>
    </div>

    <div class="shell-search-panel" id="profile-editor-panel" hidden>
      <div class="shell-search-panel__head">
        <strong>Dog profile</strong>
        <button type="button" id="profile-editor-close">Close</button>
      </div>
      <form id="profile-editor-form" class="profile-editor-form">
        <label>Dog name<input name="name" type="text"></label>
        <label>Primary breed<input name="primary_breed" type="text"></label>
        <label>Secondary breed<input name="secondary_breed" type="text"></label>
        <label>Breed split %<input name="breed_split_pct" type="number" step="1" min="0" max="100"></label>
        <label>Date of birth<input name="birthday" type="date"></label>
        <label>Weight (kg)<input name="weight" type="number" step="0.1" min="0"></label>
        <label>Height (cm)<input name="height_cm" type="number" step="0.1" min="0"></label>
        <label>Sex
          <select name="sex">
            <option value="">Select</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
          </select>
        </label>
        <label>Activity level<input name="activity_level" type="text"></label>
        <label>Environment<input name="current_environment" type="text"></label>
        <label>Body condition score<input name="bcs" type="number" step="0.1" min="1" max="9"></label>
        <label>Observed conditions (comma-separated)<textarea name="observed_conditions"></textarea></label>
        <label>Groomer observations<textarea name="groomer_observations"></textarea></label>
        <div class="profile-editor-actions">
          <button type="button" class="module-ghost" id="profile-load-demo">Load Demo Dog</button>
          <button type="submit" class="module-ghost">Analyze</button>
        </div>
      </form>
    </div>

  </div>
</div>

<div id="product-modal" class="product-modal" hidden>
  <div class="product-modal-backdrop" data-close-modal></div>
  <div class="product-modal-panel" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">
    <button type="button" class="product-modal-close" data-close-modal aria-label="Close">×</button>
    <div id="product-modal-body"></div>
  </div>
</div>

<script src="catalog-service.js?v=omega97e"></script>
<script src="report-renderer.js?v=omega97e"></script>
<script src="ppie-ui.js?v=omega97e"></script>
<script src="ppie-sheets.js?v=omega97e"></script>
<script src="ppie-trace.js?v=omega97e"></script>
<script src="ppie-shell.js?v=omega97e"></script>
<script src="app.js?v=omega97e"></script>
<script src="ppie-dev-menu.js?v=omega97e"></script>
</body>
</html>
