# Canonical PPIE data platform manifest.
# The algorithm calculates; these files define what it calculates.
version: "2.1.0"
modules:
  - breed_analysis
  - preventative_ingredients
  - product_portfolio

files:
  breed_analysis/1_biological_traits/BREEDS.csv:
    table: breeds
    primary_key: breed
    required_columns: [breed, size, body_type, coat_type, energy, weakness_group, skull_type, climate, lifespan, function_group]

  breed_analysis/1_biological_traits/BREED_ALIASES.csv:
    table: breed_aliases
    primary_key: alias
    required_columns: [alias, canonical_breed]
    foreign_keys:
      canonical_breed: { table: breeds, column: breed }

  breed_analysis/1_biological_traits/MIXED_BREED_MATRIX.csv:
    table: mixed_breed_matrix
    primary_key: [breed_a, breed_b, condition]
    required_columns: [breed_a, breed_b, condition, factor]

  breed_analysis/1_biological_traits/MIXED_BREED_INTERACTIONS.csv:
    table: mixed_breed_interactions
    primary_key: [trait_a, trait_b, condition]
    required_columns: [trait_a, trait_b, condition, factor]

  breed_analysis/2_evolutionary_profiles/TRAIT_PURPOSES.csv:
    table: trait_purposes
    primary_key: [trait_category, trait_value]
    required_columns: [trait_category, trait_value, biological_purpose]

  breed_analysis/2_evolutionary_profiles/ENVIRONMENTAL_MATRICES.csv:
    table: environmental_matrices
    primary_key: [trait_category, trait_value, climate_context, dimension]
    required_columns: [trait_category, trait_value, climate_context, dimension]

  breed_analysis/2_evolutionary_profiles/TRAIT_ATTRIBUTE_EXPLANATIONS.csv:
    table: trait_attribute_explanations
    primary_key: [trait_category, trait_value]
    required_columns: [trait_category, trait_value, card_title, explanation, source_csv]

  breed_analysis/3_management_considerations/TRAIT_CONTRIBUTION_WEIGHTS.csv:
    table: trait_contribution_weights
    primary_key: [trait_category, trait_value, condition]
    required_columns: [trait_category, trait_value, condition, risk_delta, source_csv]

  breed_analysis/3_management_considerations/CLINICAL_RISK_TIMELINE.csv:
    table: clinical_risk_timeline
    primary_key: [age_stage, trait_or_breed, condition]
    required_columns: [age_stage, trait_or_breed, condition, risk_level]

  breed_analysis/4_preventative_interventions/ACTIVITY_PRESCRIPTION_RULES.csv:
    table: activity_prescription_rules
    primary_key: [energy, size, body_type, age_stage]
    required_columns: [energy, size, body_type, age_stage, daily_km]

  breed_analysis/4_preventative_interventions/GROOMING_OBSERVATION_DEFS.csv:
    table: grooming_observation_defs
    primary_key: observation_key
    required_columns: [observation_key, label, normal_criteria]

  breed_analysis/3_management_considerations/BREED_CONDITIONS.csv:
    table: breed_conditions
    primary_key: [breed, condition]
    required_columns: [breed, condition, prevalence]
    foreign_keys:
      breed: { table: breeds, column: breed }

  breed_analysis/3_management_considerations/SIZE_CONDITIONS.csv:
    table: size_conditions
    primary_key: [size, condition]
    required_columns: [size, condition, prevalence]

  breed_analysis/3_management_considerations/BODYTYPE_CONDITIONS.csv:
    table: bodytype_conditions
    primary_key: [body_type, condition]
    required_columns: [body_type, condition, prevalence]

  breed_analysis/3_management_considerations/COATTYPE_CONDITIONS.csv:
    table: coattype_conditions
    primary_key: [coat_type, condition]
    required_columns: [coat_type, condition, prevalence]

  breed_analysis/3_management_considerations/ENERGY_CONDITIONS.csv:
    table: energy_conditions
    primary_key: [energy, condition]
    required_columns: [energy, condition, prevalence]

  breed_analysis/3_management_considerations/SKULLTYPE_CONDITIONS.csv:
    table: skulltype_conditions
    primary_key: [skull_type, condition]
    required_columns: [skull_type, condition, prevalence]

  breed_analysis/3_management_considerations/CLIMATE_CONDITIONS.csv:
    table: climate_conditions
    primary_key: [climate, condition]
    required_columns: [climate, condition, prevalence]

  breed_analysis/3_management_considerations/FUNCTIONGROUP_CONDITIONS.csv:
    table: functiongroup_conditions
    primary_key: [function_group, condition]
    required_columns: [function_group, condition, prevalence]

  breed_analysis/3_management_considerations/WEAKNESSGROUP_CONDITIONS.csv:
    table: weaknessgroup_conditions
    primary_key: [weakness_group, condition]
    required_columns: [weakness_group, condition, prevalence]

  breed_analysis/3_management_considerations/LIFESPAN_CONDITIONS.csv:
    table: lifespan_conditions
    primary_key: [lifespan, condition]
    required_columns: [lifespan, condition, prevalence]

  breed_analysis/3_management_considerations/TRAIT_INTERACTIONS.csv:
    table: trait_interactions
    primary_key: [trait_a, trait_b, condition]
    required_columns: [trait_a, trait_b, condition, factor]

  breed_analysis/4_preventative_interventions/TRAIT_BENEFITS.csv:
    table: trait_benefits
    primary_key: [trait_a, trait_b, condition]
    required_columns: [trait_a, trait_b, condition, reduction_factor]

  breed_analysis/4_preventative_interventions/CONDITION_ACTIVITIES.csv:
    table: condition_activities
    primary_key: [condition, activity_name]
    required_columns: [condition, activity_name]

  breed_analysis/4_preventative_interventions/ACTIVITY_EVIDENCE.csv:
    table: activity_evidence
    primary_key: activity_name
    required_columns: [activity_name, source_name]

  breed_analysis/5_scientific_nutrition/CONDITION_INGREDIENTS.csv:
    table: condition_ingredients_sci
    primary_key: [condition, ingredient_name]
    required_columns: [condition, ingredient_name, recommended_daily_dose, dose_unit]

  breed_analysis/5_scientific_nutrition/INGREDIENT_EVIDENCE.csv:
    table: ingredient_evidence_sci
    primary_key: [ingredient_name, source_name]
    required_columns: [ingredient_name, source_name]

  breed_analysis/5_scientific_nutrition/INGREDIENT_MECHANISMS.csv:
    table: ingredient_mechanisms
    primary_key: [nutrient_name, ingredient_name, source_product_id]
    required_columns: [nutrient_name, ingredient_name]

  breed_analysis/5_scientific_nutrition/NATURAL_FOOD_SOURCES.csv:
    table: natural_food_sources
    primary_key: [ingredient_name, food_source]
    required_columns: [ingredient_name, food_source]

  breed_analysis/5_scientific_nutrition/NUTRIENT_PRIORITIES.csv:
    table: nutrient_priorities
    primary_key: [condition, nutrient_name]
    required_columns: [condition, nutrient_name, target_dose, target_unit]

  breed_analysis/5_scientific_nutrition/CLINICAL_EVIDENCE_BASE.csv:
    table: clinical_evidence_base
    primary_key: evidence_id
    required_columns: [evidence_id, domain, condition]

  breed_analysis/5_scientific_nutrition/INGREDIENT_ALIASES.csv:
    table: ingredient_aliases
    primary_key: [canonical_key, alias_key]
    required_columns: [canonical_key, alias_key]

  preventative_ingredients/CONDITION_INGREDIENTS.csv:
    table: condition_ingredients_prev
    primary_key: [condition, ingredient_name]
    required_columns: [condition, ingredient_name, recommended_daily_dose, dose_unit]

  preventative_ingredients/INGREDIENT_EVIDENCE.csv:
    table: ingredient_evidence_prev
    primary_key: [ingredient_name, source_name]
    required_columns: [ingredient_name, source_name]

  preventative_ingredients/CONDITION_PROTOCOLS.csv:
    table: condition_protocols
    primary_key: [condition, ingredient_name]
    required_columns: [condition, ingredient_name]

  product_portfolio/PRODUCT_CATALOG.csv:
    table: products
    primary_key: product_id
    required_columns: [product_id, brand, category, product_name, status]

  product_portfolio/PRODUCT_PRICING.csv:
    table: product_pricing
    primary_key: product_id
    required_columns: [product_id, list_price_rmb, package_units, unit_label]
    foreign_keys:
      product_id: { table: products, column: product_id }

  product_portfolio/PRODUCT_COMPONENTS.csv:
    table: product_components
    primary_key: [product_id, component_type, component_name]
    required_columns: [product_id, component_type, component_name]
    foreign_keys:
      product_id: { table: products, column: product_id }

  product_portfolio/PRODUCT_FEEDING_RULES.csv:
    table: product_feeding_rules
    primary_key: [product_id, min_weight_kg, max_weight_kg]
    required_columns: [product_id, min_weight_kg, max_weight_kg, daily_amount, daily_unit]
    foreign_keys:
      product_id: { table: products, column: product_id }

  product_portfolio/EXT_SUPPLEMENTS.csv:
    table: ext_supplements
    primary_key: product_id
    required_columns: [product_id, storage_method, shelf_life_days]
    allow_empty: true
    foreign_keys:
      product_id: { table: products, column: product_id }

  product_portfolio/EXT_TREATS_BAKERY.csv:
    table: ext_treats_bakery
    primary_key: product_id
    required_columns: [product_id, storage_method, shelf_life_days]
    foreign_keys:
      product_id: { table: products, column: product_id }

  product_portfolio/PRODUCT_FUNCTIONS.csv:
    table: product_functions
    primary_key: [product_id, function]
    required_columns: [product_id, function]
    allow_empty: true
    foreign_keys:
      product_id: { table: products, column: product_id }

  product_portfolio/PACKAGE_TIERS.csv:
    table: package_tiers
    primary_key: tier_id
    required_columns: [tier_id, title, yearly_discount_factor, staple_product_id, sort_order]
    foreign_keys:
      staple_product_id: { table: products, column: product_id }

  product_portfolio/PRODUCT_DEFAULTS.csv:
    table: product_defaults
    primary_key: key
    required_columns: [key, product_id]
    foreign_keys:
      product_id: { table: products, column: product_id }

  # Scientific nutrient densities for estimation (intern-verifiable literature values)
  breed_analysis/5_scientific_nutrition/INGREDIENT_NUTRIENT_ESTIMATES.csv:
    table: ingredient_nutrient_estimates
    primary_key: [canonical_ingredient, nutrient]
    required_columns: [ingredient, canonical_ingredient, nutrient, amount_per_100g, unit, confidence, source, is_estimated]
    allow_empty: true
